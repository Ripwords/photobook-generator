[package]
name = "photobook-generator"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "PhotobookGen"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
thiserror = "2"
log = "0.4"
tauri-plugin-log = "2"

# Free-disk-space check in pre-flight (`book::preflight::available_bytes`),
# via `statfs`. Already present transitively (tauri/tao pull it in); pinned
# directly because the crate must be `use`-able from our own code, which
# requires a direct dependency edge, not just a transitive one.
libc = "0.2"

[dev-dependencies]
tempfile = "3"

# Needed directly (not just via tauri's re-export) to build a
# worker-thread-constrained runtime with `tokio::runtime::Builder`, to
# reproduce the worker-pool starvation deadlock from a low-core machine.
# Left unpinned beyond "1" so it unifies with whatever version tauri's own
# tokio dependency already resolves to (required: `tauri::async_runtime::set`
# takes tauri's re-exported `tokio::runtime::Handle` type, which must be the
# exact same version for the types to match).
tokio = { version = "1", features = ["rt-multi-thread"] }

# Property tests on the geometry predicates. The design doc (section 12)
# calls for these by name: the interesting failures are the ones no
# hand-written fixture thinks to try.
proptest = "1"

# `analyze_folder` (and everything it calls: `Sidecar::spawn`, `ShellExt`,
# etc.) is typed against the concrete default `AppHandle` (= `AppHandle<Wry>`),
# not generic over `tauri::Runtime` -- so `tauri::test::mock_builder`'s
# `MockRuntime` AppHandle doesn't type-check against it, and building a real
# `Wry` app requires calling into AppKit/tao on the actual process main
# thread, which the default `#[test]` harness does not guarantee (it runs
# tests on worker threads). `harness = false` makes this binary a plain
# `fn main()` run directly by cargo test on the real main thread instead.
[[test]]
name = "sidecar_worker_pool"
harness = false

# Same reasoning as `sidecar_worker_pool` above: `analyze_folder` needs a
# real `Wry` `AppHandle`, which must be built on the process's actual main
# thread -- the default `#[test]` harness runs on a worker thread instead.
[[test]]
name = "cache_hit"
harness = false

# Same reasoning as `sidecar_worker_pool` above.
[[test]]
name = "streaming_order"
harness = false

# Same reasoning as `sidecar_worker_pool` above: `Sidecar::spawn` needs a
# real `Wry` `AppHandle`, built on the process's actual main thread.
[[test]]
name = "sidecar_stderr"
harness = false
