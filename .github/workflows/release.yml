name: Release

# A pushed `v*` tag (normally from `bun run release`) opens a draft release
# with changelogen notes, builds the Apple Silicon dmg into it, and publishes
# it. Running the workflow by hand only builds the dmg and attaches it to the
# run as an artifact; it never creates a release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Waits for the CI run the release commit's push to master already started,
  # rather than running the suite a second time. The build runs alongside this
  # into a draft release, which users and the updater cannot see; only publish
  # waits for it. A tag on a commit that was never pushed to master has no CI
  # run and fails here.
  ci:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for CI on the tagged commit
        run: |
          # The tag and the commit are pushed a moment apart, so the run may not exist yet.
          for _ in $(seq 1 18); do
            RUN=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
              --event push --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$RUN" ] && break
            sleep 10
          done
          if [ -z "$RUN" ]; then
            echo "::error::no CI run for ${GITHUB_SHA}. Push the commit to master before tagging it."
            exit 1
          fi
          echo "Waiting for $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN"
          # A later push to master cancels this run (cancel-in-progress), which
          # fails here too: re-run that CI run, then this job.
          gh run watch "$RUN" -R "$GITHUB_REPOSITORY" --exit-status --interval 30 > /dev/null

  create-release:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history and tags, so changelogen can diff

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # The dmg is named from tauri.conf.json's version and the README links
      # to it by the tag, so a hand-pushed tag that disagrees would publish a
      # release the download button cannot reach.
      - name: Check the tag matches the app version
        run: |
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match tauri.conf.json version ${VERSION}"
            exit 1
          fi

      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD | tail -1)
          fi
          echo "Generating notes from ${PREV_TAG} to ${GITHUB_REF_NAME}"
          # Written to a file because stdout carries consola's [log] prefix in
          # CI; the "## <from>...<to>" heading and leading blank lines go.
          bun x changelogen --output RELEASE_NOTES.md --from "${PREV_TAG}" --to "${GITHUB_REF_NAME}"
          NOTES=$(sed '/^## /d' RELEASE_NOTES.md | sed '/./,$!d')
          rm -f RELEASE_NOTES.md
          {
            echo "body<<CHANGELOG_EOF"
            echo "${NOTES}"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create draft release
        id: create
        uses: actions/github-script@v8
        env:
          RELEASE_BODY: ${{ steps.notes.outputs.body }}
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.GITHUB_REF_NAME,
              name: `PhotobookGen ${process.env.GITHUB_REF_NAME}`,
              body: process.env.RELEASE_BODY || 'See the assets below to download this version.',
              draft: true,
              prerelease: false
            })
            return data.id

  build:
    needs: create-release
    # Runs after a successful create-release on a tag, or on its own when
    # dispatched by hand (create-release is then skipped).
    if: ${{ !cancelled() && (needs.create-release.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.create-release.result == 'skipped')) }}
    runs-on: macos-15 # Apple Silicon; arm64 only, never universal
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build sidecar
        run: bun run sidecar

      # With no releaseId (the manual run) tauri-action only builds.
      #
      # The signing key is the updater's whole trust anchor: the app ships
      # with the matching public key and refuses an update whose signature
      # does not verify. Without the secret the build still succeeds, but it
      # produces no `.sig`, and `includeUpdaterJson` then publishes a
      # `latest.json` no installed app will accept. The key is a minisign
      # keypair from `tauri signer generate`, unrelated to Apple's Developer
      # ID; the bundle itself is still unsigned and un-notarized.
      - name: Build the dmg and upload it to the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: true
          args: --target aarch64-apple-darwin

      - name: Attach the dmg to the run
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: PhotobookGen-aarch64-dmg
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  publish:
    needs: [ci, create-release, build]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Publish the release
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false
            })

  # Only once the release is public, so the homepage button never names a dmg
  # that does not exist. A push with GITHUB_TOKEN starts no workflow, so this
  # commit does not run CI again. Re-running the job is safe: an already
  # stamped README commits nothing.
  readme:
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Point the download button at this release
        run: |
          bun scripts/stamp-readme.ts "${GITHUB_REF_NAME#v}"
          if git diff --quiet README.md; then
            echo "README already points at ${GITHUB_REF_NAME}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(readme): point the download button at ${GITHUB_REF_NAME}" README.md
          git push origin HEAD:master
